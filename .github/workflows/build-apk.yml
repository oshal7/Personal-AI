name: Build debug APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/offline-ai-apk-ollama-2yb22k

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform/build-tools/NDK/CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;29.0.13113456"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Raise inference thread cap
        run: |
          sed -i \
            -e 's/constexpr int   N_THREADS_MAX           = 4;/constexpr int   N_THREADS_MAX           = 6;/' \
            llama/src/main/cpp/third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp

      - name: Run unit tests
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.13113456"
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.13113456"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: Debug APK (run ${{ github.run_id }})
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
