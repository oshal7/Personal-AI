# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with the app's APK.
android.useAndroidX=true

# Namespacing of each library's R class so it only includes resources declared
# in the library itself, reducing R class size.
android.nonTransitiveRClass=true

# Kotlin code style for this project.
kotlin.code.style=official
